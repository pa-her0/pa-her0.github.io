name: Update Books Data

on:
  schedule:
    - cron: '0 0 * * 0'  # 每周日 UTC 00:00 运行
  workflow_dispatch:  # 允许手动触发

jobs:
  update-books:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 明确设置写入权限

    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests  # 直接指定必要的依赖

      - name: Update books data
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
          FEISHU_TABLE_ID_COMICS: ${{ secrets.FEISHU_TABLE_ID_COMICS }}
          FEISHU_TABLE_ID_PAPERS: ${{ secrets.FEISHU_TABLE_ID_PAPERS }}
        run: |
          python scripts/test_feishu_bitable.py

      - name: Sync comics from komiic
        if: ${{ secrets.KOMIIC_EMAIL != '' || secrets.KOMIIC_TOKEN != '' }}
        env:
          KOMIIC_EMAIL: ${{ secrets.KOMIIC_EMAIL }}
          KOMIIC_PASSWORD: ${{ secrets.KOMIIC_PASSWORD }}
          KOMIIC_TOKEN: ${{ secrets.KOMIIC_TOKEN }}
        run: |
          python scripts/sync_komiic.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/books.json public/data/comics.json public/data/papers.json
          git add public/images/books/* public/images/comics/* 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update bookshelf data [skip ci]" && git push)
